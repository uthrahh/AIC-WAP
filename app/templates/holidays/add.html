{% extends "layouts/base.html" %}

{% block content %}

<h3>Add Holiday</h3>

<form
    method="post"
    action="/api/holidays/add"
>

    <div class="row">

        <div class="col-md-4">

            <input
                type="date"
                name="date"
                class="form-control"
                required
            >

        </div>

        <div class="col-md-6">

            <input
                type="text"
                name="name"
                class="form-control"
                placeholder="Holiday Name"
                required
            >

        </div>

    </div>

    <button
        class="btn btn-primary mt-3"
        type="submit"
    >
        Save Holiday
    </button>

</form>

{% endblock %}
