{% extends "layouts/base.html" %}

{% block content %}

<h2>
    Completed Tasks Report
</h2>

<form
    method="get"
    action="/api/reports/tasks/report/download"
>

    <div class="row">

        <div class="col-md-4">

            <label>
                Start Date
            </label>

            <input
                type="date"
                name="start_date"
                class="form-control"
                required
            >

        </div>

        <div class="col-md-4">

            <label>
                End Date
            </label>

            <input
                type="date"
                name="end_date"
                class="form-control"
                required
            >

        </div>

    </div>

    <button
        class="btn btn-primary mt-3"
        type="submit"
    >
        Download PDF
    </button>

</form>

{% endblock %}
